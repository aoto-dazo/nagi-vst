name: Build Windows VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target Nagi_VST3 --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nagi-VST3-Windows-x64
          path: build/Nagi_artefacts/Release/VST3/Nagi.vst3
